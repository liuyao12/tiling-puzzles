<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2eee5" />
    <meta name="description" content="A simple L-triomino tiling puzzle." />
    <title>One Short — A Tiling Puzzle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <a class="mark" href="." aria-label="One Short home">
          <span class="mark-shape" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>ONE SHORT</span>
        </a>
      </header>
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">L–TRIOMINO NO. 01</p>
        <h1 id="title">Make every piece<br /><em>fit.</em></h1>
      </section>
      <section class="game" aria-label="Tiling puzzle">
        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Puzzle board"></div>
          <div id="tile-layer" class="tile-layer" aria-label="Placed tiles"></div>
          <div id="win" class="win" hidden>
            <div class="win-mark" aria-hidden="true">✓</div>
            <strong>Perfect fit.</strong>
            <button id="play-again" type="button">Play again</button>
          </div>
        </div>
        <aside class="controls" aria-label="Puzzle controls">
          <div class="control-section">
            <span class="label">Board</span>
            <div class="dimensions" aria-label="Board dimensions">
              <div class="dimension-control">
                <span>Width</span>
                <div class="stepper">
                  <button type="button" data-dimension="width" data-step="-1" aria-label="Decrease width">−</button>
                  <output id="width-output">8</output>
                  <button type="button" data-dimension="width" data-step="1" aria-label="Increase width">+</button>
                </div>
              </div>
              <div class="dimension-control">
                <span>Height</span>
                <div class="stepper">
                  <button type="button" data-dimension="height" data-step="-1" aria-label="Decrease height">−</button>
                  <output id="height-output">8</output>
                  <button type="button" data-dimension="height" data-step="1" aria-label="Increase height">+</button>
                </div>
              </div>
            </div>
            <p id="missing-count" class="missing-count">1 square missing</p>
          </div>
          <div class="control-section piece-section">
            <span class="label">Pieces</span>
            <div class="piece-controls" aria-label="Drag a piece to the board">
              <button class="piece-tray" type="button" data-piece-rotation="0" aria-label="Drag L-triomino, orientation 1">
                <span class="piece-preview tile-shape" data-rotation="0" aria-hidden="true"></span>
              </button>
              <button class="piece-tray" type="button" data-piece-rotation="1" aria-label="Drag L-triomino, orientation 2">
                <span class="piece-preview tile-shape" data-rotation="1" aria-hidden="true"></span>
              </button>
              <button class="piece-tray" type="button" data-piece-rotation="2" aria-label="Drag L-triomino, orientation 3">
                <span class="piece-preview tile-shape" data-rotation="2" aria-hidden="true"></span>
              </button>
              <button class="piece-tray" type="button" data-piece-rotation="3" aria-label="Drag L-triomino, orientation 4">
                <span class="piece-preview tile-shape" data-rotation="3" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="control-section progress-section">
            <span class="label">Placed</span>
            <div class="counter"><strong id="placed-count">0</strong><span> / </span><span id="total-count">21</span></div>
          </div>
          <div class="actions">
            <button id="undo" type="button" disabled>Undo</button>
            <button id="reset" type="button">Reset</button>
            <button id="new-puzzle" type="button">New puzzle</button>
          </div>
        </aside>
      </section>
    </main>
    <div id="drag-piece" class="drag-piece tile-shape" aria-hidden="true"></div>
    <script src="app.js"></script>
  </body>
</html>
